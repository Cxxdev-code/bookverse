spring:
  application:
    name: gestao-custos

  datasource:
    url: jdbc:h2:file:./data/biblioteca;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0
    locations: classpath:db/migration
  h2:
    console:
      enabled: true
      path: /h2-console

bookverse:
  security:
    jwt:
      # Em produção, defina BOOKVERSE_JWT_SECRET com uma chave longa e privada.
      secret: ${BOOKVERSE_JWT_SECRET:BookVerse-chave-local-de-desenvolvimento-com-mais-de-trinta-e-dois-caracteres}
      expiracao-minutos: ${BOOKVERSE_JWT_EXPIRACAO_MINUTOS:120}
  cors:
    origins: ${BOOKVERSE_CORS_ORIGINS:http://127.0.0.1:5500,http://localhost:5500}
  admin:
    email: ${BOOKVERSE_ADMIN_EMAIL:admin@bookverse.local}
    senha: ${BOOKVERSE_ADMIN_SENHA:admin123}
    nome: ${BOOKVERSE_ADMIN_NOME:Administrador BookVerse}
