# Blueprint do Render: cria o banco Postgres e a API Spring Boot juntos.
# Uso: Render > New > Blueprint > escolha o repositório (este arquivo fica na raiz).
databases:
  - name: bookverse-db
    plan: free
    databaseName: bookverse
    user: bookverse

services:
  - type: web
    name: bookverse-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    envVars:
      - key: BOOKVERSE_DB_HOST
        fromDatabase: { name: bookverse-db, property: host }
      - key: BOOKVERSE_DB_PORT
        fromDatabase: { name: bookverse-db, property: port }
      - key: BOOKVERSE_DB_NAME
        fromDatabase: { name: bookverse-db, property: database }
      - key: BOOKVERSE_DB_USER
        fromDatabase: { name: bookverse-db, property: user }
      - key: BOOKVERSE_DB_PASSWORD
        fromDatabase: { name: bookverse-db, property: password }
      - key: BOOKVERSE_JWT_SECRET
        generateValue: true
      - key: BOOKVERSE_ADMIN_EMAIL
        sync: false          # o Render pergunta ao criar
      - key: BOOKVERSE_ADMIN_SENHA
        sync: false          # o Render pergunta ao criar
      - key: BOOKVERSE_CORS_ORIGINS
        sync: false          # URL do front na Vercel, ex.: https://seu-site.vercel.app
